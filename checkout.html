<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>結帳｜TWILUME</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, "Noto Sans TC", sans-serif;
      background: #f7f7f5;
      color: #222;
    }

    header {
      padding: 25px 20px;
      text-align: center;
      background: #fff;
      border-bottom: 1px solid #eee;
    }

    .logo {
      font-size: 24px;
      letter-spacing: 5px;
    }

    .back {
      display: block;
      margin-top: 10px;
      color: #777;
      font-size: 12px;
      text-decoration: none;
    }

    main {
      padding: 30px 18px 60px;
    }

    h1 {
      text-align: center;
      font-size: 20px;
      font-weight: 400;
      letter-spacing: 3px;
      margin-bottom: 30px;
    }

    .section {
      background: #fff;
      padding: 20px;
      margin-bottom: 18px;
    }

    .section-title {
      font-size: 13px;
      letter-spacing: 2px;
      margin-bottom: 18px;
    }

    label {
      display: block;
      margin-top: 15px;
      margin-bottom: 7px;
      font-size: 12px;
      color: #666;
    }

    input,
    select,
    textarea {
      width: 100%;
      padding: 13px;
      border: 1px solid #ddd;
      background: #fff;
      font-size: 13px;
      font-family: inherit;
    }

    textarea {
      height: 90px;
      resize: vertical;
    }

    .order-item {
      padding: 12px 0;
      border-bottom: 1px solid #eee;
      font-size: 13px;
      line-height: 1.8;
    }

    .total {
      display: flex;
      justify-content: space-between;
      padding-top: 18px;
      font-size: 15px;
    }

    .submit {
      width: 100%;
      padding: 17px;
      border: none;
      background: #222;
      color: #fff;
      font-size: 13px;
      letter-spacing: 2px;
    }

    .notice {
      margin-top: 15px;
      text-align: center;
      color: #888;
      font-size: 11px;
      line-height: 1.8;
    }
  </style>
</head>

<body>

  <header>
    <div class="logo">TWILUME</div>
    <a href="cart.html" class="back">← BACK TO CART</a>
  </header>

  <main>

    <h1>CHECKOUT</h1>

    <div class="section">

      <div class="section-title">
        CUSTOMER INFORMATION
      </div>

      <label>姓名 *</label>
      <input type="text" id="name" placeholder="請輸入姓名">

      <label>手機號碼 *</label>
      <input type="tel" id="phone" placeholder="請輸入手機號碼">

      <label>Email</label>
      <input type="email" id="email" placeholder="請輸入 Email">

      <label>收件方式 *</label>

      <select id="delivery">
        <option value="">請選擇</option>
        <option>7-11 取貨</option>
        <option>全家取貨</option>
        <option>宅配</option>
      </select>

      <label>收件資料 *</label>
      <input
        type="text"
        id="address"
        placeholder="門市名稱／收件地址"
      >

      <label>備註</label>

      <textarea
        id="note"
        placeholder="有其他需求可以寫在這裡"
      ></textarea>

    </div>

    <div class="section">

      <div class="section-title">
        YOUR ORDER
      </div>

      <div id="order"></div>

    </div>

    <button class="submit" onclick="submitOrder()">
      PLACE ORDER
    </button>

    <div class="notice">
      ※ 此頁面目前為測試版訂單流程
    </div>

  </main>

  <script>

    const cart = JSON.parse(
      localStorage.getItem('twilumeCart')
    );

    const orderArea = document.getElementById('order');

    if (!cart) {

      orderArea.innerHTML =
        '<p style="color:#888;font-size:13px;">購物車目前沒有商品。</p>';

    } else {

      const total = cart.price * cart.quantity;

      orderArea.innerHTML = `
        <div class="order-item">
          <strong>${cart.name}</strong><br>
          規格：${cart.option}<br>
          數量：${cart.quantity}<br>
          小計：NT$ ${total.toLocaleString()}
        </div>

        <div class="total">
          <span>訂單合計</span>
          <strong>NT$ ${total.toLocaleString()}</strong>
        </div>
      `;
    }


    function submitOrder() {

      const name =
        document.getElementById('name').value;

      const phone =
        document.getElementById('phone').value;

      const delivery =
        document.getElementById('delivery').value;

      const address =
        document.getElementById('address').value;


      if (!name || !phone || !delivery || !address) {

        alert('請確認必填資料是否完整');

        return;
      }


      alert(
        '訂單已送出！\\n\\n' +
        '這是目前的測試版本。'
      );

    }

  </script>

</body>
</html>
