<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>購物車｜TWILUME</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, "Noto Sans TC", sans-serif;
      background: #f7f7f5;
      color: #222;
    }

    header {
      padding: 25px 20px;
      text-align: center;
      background: #fff;
      border-bottom: 1px solid #eee;
    }

    .logo {
      font-size: 24px;
      letter-spacing: 5px;
    }

    .back {
      display: block;
      margin-top: 10px;
      color: #777;
      font-size: 12px;
      text-decoration: none;
    }

    main {
      padding: 30px 18px 60px;
    }

    h1 {
      text-align: center;
      font-size: 20px;
      font-weight: 400;
      letter-spacing: 3px;
      margin-bottom: 30px;
    }

    .empty {
      text-align: center;
      padding: 60px 20px;
      color: #777;
      font-size: 13px;
      line-height: 2;
    }

    .item {
      background: #fff;
      padding: 18px;
      margin-bottom: 15px;
    }

    .item-name {
      font-size: 15px;
    }

    .item-option {
      margin-top: 8px;
      color: #777;
      font-size: 12px;
    }

    .item-price {
      margin-top: 12px;
      font-size: 14px;
    }

    .total {
      margin-top: 30px;
      padding-top: 20px;
      border-top: 1px solid #ddd;
      display: flex;
      justify-content: space-between;
      font-size: 15px;
    }

    .checkout {
      width: 100%;
      margin-top: 25px;
      padding: 16px;
      border: none;
      background: #222;
      color: #fff;
      font-size: 13px;
      letter-spacing: 2px;
    }
  </style>
</head>

<body>

  <header>
    <div class="logo">TWILUME</div>
    <a href="index.html" class="back">← BACK TO SHOP</a>
  </header>

  <main>

    <h1>SHOPPING CART</h1>

    <div id="cart"></div>

  </main>

  <script>
    const cart = JSON.parse(localStorage.getItem('twilumeCart'));

    const cartArea = document.getElementById('cart');

    if (!cart) {

      cartArea.innerHTML = `
        <div class="empty">
          購物車目前是空的<br><br>
          <a href="index.html">繼續購物</a>
        </div>
      `;

    } else {

      const total = cart.price * cart.quantity;

      cartArea.innerHTML = `
        <div class="item">

          <div class="item-name">
            ${cart.name}
          </div>

          <div class="item-option">
            規格：${cart.option}
          </div>

          <div class="item-price">
            NT$ ${cart.price.toLocaleString()} × ${cart.quantity}
          </div>

        </div>

        <div class="total">
          <span>合計</span>
          <strong>NT$ ${total.toLocaleString()}</strong>
        </div>

        <button class="checkout" onclick="goCheckout()">
          CHECKOUT
        </button>
      `;
    }

    function goCheckout() {
      window.location.href = 'checkout.html';
    }
  </script>

</body>
</html>
